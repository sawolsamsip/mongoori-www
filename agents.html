<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mongoori Agents — Operating System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0D0D0D; --bg2: #111111; --bg3: #161616;
  --border: rgba(255,255,255,.08);
  --text: #F5F5F5; --muted: #6B7280;
  --accent: #3B82F6; --accent-soft: #3B82F626; --accent-glow: #3B82F640;
  --mono: 'JetBrains Mono', monospace; --sans: 'Inter', sans-serif;
  --radius: 12px;
}
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.6; }
a { color: inherit; text-decoration: none; }

/* Nav */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(13,13,13,.85); border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
}
.nav-inner {
  max-width: 1100px; margin: 0 auto; padding: 0 24px;
  height: 60px; display: flex; align-items: center; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 8px; }
.brand-mark {
  width: 28px; height: 28px; border-radius: 6px;
  background: var(--accent); display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 14px; font-weight: 600; color: #fff;
}
.brand-name { font-size: 15px; letter-spacing: -.01em; }
.nav-links { display: flex; align-items: center; gap: 24px; }
.nav-links a { font-size: 14px; color: var(--muted); transition: color .15s; }
.nav-links a:hover, .nav-links a.active { color: var(--text); }
.nav-back {
  font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px;
  transition: color .15s;
}
.nav-back:hover { color: var(--text); }

/* Hero */
.hero {
  padding: 120px 24px 72px; max-width: 1100px; margin: 0 auto;
  position: relative;
}
.hero-bg {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
}
.hero-grid {
  position: absolute; inset: 0;
  background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 30%, transparent 100%);
}
.hero-glow {
  position: absolute; top: -10%; left: 50%; transform: translateX(-50%);
  width: 600px; height: 400px;
  background: radial-gradient(ellipse at center, var(--accent-glow) 0%, transparent 70%);
}
.eyebrow {
  display: flex; align-items: center; gap: 10px;
  font-size: 11px; font-family: var(--mono); color: var(--accent);
  text-transform: uppercase; letter-spacing: .1em; margin-bottom: 20px;
}
.eyebrow-line { width: 28px; height: 1px; background: var(--accent); flex-shrink: 0; }
.hero-title {
  font-size: clamp(36px,5vw,60px); font-weight: 700;
  letter-spacing: -.03em; line-height: 1.1; margin-bottom: 16px;
}
.hero-grad {
  background: linear-gradient(135deg, var(--accent) 0%, #7c3aed 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.hero-sub { font-size: 17px; color: var(--muted); max-width: 520px; margin-bottom: 36px; line-height: 1.7; }
.hero-stats { display: flex; gap: 40px; flex-wrap: wrap; }
.hero-stat { display: flex; flex-direction: column; gap: 2px; }
.hero-stat-k { font-size: 24px; font-weight: 700; font-family: var(--mono); }
.hero-stat-v { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

/* Team sections */
.teams { max-width: 1100px; margin: 0 auto; padding: 0 24px 96px; display: flex; flex-direction: column; gap: 64px; }

.team-section {}
.team-label {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 24px;
}
.team-label-text {
  font-size: 11px; font-family: var(--mono); color: var(--muted);
  text-transform: uppercase; letter-spacing: .1em;
}
.team-label-line { flex: 1; height: 1px; background: var(--border); }
.team-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
}
.team-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.team-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }

/* Agent Card */
.agent-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
  transition: border-color .2s, background .2s;
  cursor: pointer;
}
.agent-card:hover { border-color: rgba(59,130,246,.25); background: var(--bg3); }
.agent-card.open { border-color: rgba(59,130,246,.3); }

.agent-card-top {
  padding: 20px 20px 16px;
}
.agent-head {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
}
.agent-badge {
  font-size: 10px; font-family: var(--mono); font-weight: 600; letter-spacing: .06em;
  background: var(--accent-soft); border: 1px solid rgba(59,130,246,.25);
  color: var(--accent); border-radius: 5px; padding: 3px 8px;
}
.agent-pulse {
  width: 7px; height: 7px; border-radius: 50%;
  background: #22c55e; box-shadow: 0 0 6px #22c55e80;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.agent-name { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.agent-desc { font-size: 12px; color: var(--muted); line-height: 1.55; }
.agent-foot {
  padding: 10px 20px 14px;
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid var(--border);
}
.agent-reports {
  font-size: 11px; font-family: var(--mono); color: var(--muted);
}
.agent-expand {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--muted);
}
.expand-arrow {
  transition: transform .2s;
}
.agent-card.open .expand-arrow { transform: rotate(90deg); }

/* Skills panel */
.agent-skills {
  display: none; padding: 0 20px 16px; border-top: 1px solid var(--border);
}
.agent-card.open .agent-skills { display: block; }
.skill-group { margin-top: 14px; }
.skill-group-label {
  font-size: 10px; font-family: var(--mono); color: var(--muted);
  text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px;
}
.skill-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.skill-chip {
  font-size: 11px; color: #D1D5DB;
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09);
  border-radius: 5px; padding: 3px 8px;
}

/* Org line hints */
.reports-badge {
  font-size: 10px; font-family: var(--mono);
  color: var(--muted); background: var(--bg3);
  border: 1px solid var(--border); border-radius: 4px;
  padding: 2px 6px;
}

@media (max-width: 900px) {
  .team-grid { grid-template-columns: repeat(2, 1fr); }
  .team-grid.cols-3 { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 560px) {
  .team-grid, .team-grid.cols-3, .team-grid.cols-2 { grid-template-columns: 1fr; }
  .hero-stats { gap: 20px; }
}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="/">
      <span class="brand-mark">m</span>
      <span class="brand-name"><strong>mongoori</strong></span>
    </a>
    <nav class="nav-links">
      <a href="/#portfolio">Portfolio</a>
      <a href="/#about">About</a>
      <a href="/agents" class="active">Agents</a>
    </nav>
  </div>
</header>

<div style="position:relative; overflow:hidden;">
  <div class="hero-bg">
    <div class="hero-grid"></div>
    <div class="hero-glow"></div>
  </div>
  <div class="hero">
    <div class="eyebrow"><span class="eyebrow-line"></span><span>The Operating System</span></div>
    <h1 class="hero-title">19 Agents.<br/><span class="hero-grad">One Company.</span></h1>
    <p class="hero-sub">Every function — finance, engineering, ops, legal — is staffed by a specialized AI agent running 24/7 on Mongoori infrastructure.</p>
    <div class="hero-stats">
      <div class="hero-stat"><span class="hero-stat-k" id="total-agents">19</span><span class="hero-stat-v">Agents</span></div>
      <div class="hero-stat"><span class="hero-stat-k" id="total-skills">—</span><span class="hero-stat-v">Skills</span></div>

<div class="teams" id="teams"></div>

<script>

  eng: {

// Count total skills
let totalSkills = 0;
Object.values(AGENTS).forEach(team => {
  team.agents.forEach(agent => {
    if (agent.groups) {
      agent.groups.forEach(g => totalSkills += g.skills.length);
    }
  });
});
document.getElementById('total-skills').textContent = totalSkills;

// Render teams
const teamsEl = document.getElementById('teams');

Object.entries(AGENTS).forEach(([key, team]) => {
  const section = document.createElement('div');
  section.className = 'team-section';

  const cols = team.agents.length >= 4 ? '' : (team.agents.length === 3 ? ' cols-3' : ' cols-2');

  section.innerHTML = `
    <div class="team-label">
      <span class="team-label-text">${team.label}</span>
      <span class="team-label-line"></span>
    </div>
    <div class="team-grid${cols}">
      ${team.agents.map(agent => renderCard(agent)).join('')}
    </div>
  `;

  teamsEl.appendChild(section);
});

function renderCard(agent) {
  const skillCount = agent.groups ? agent.groups.reduce((s, g) => s + g.skills.length, 0) : 0;
  const reportsHtml = agent.reportsTo
    ? `<span class="reports-badge">→ ${agent.reportsTo}</span>`
    : `<span class="reports-badge" style="color:#3B82F6;border-color:rgba(59,130,246,.3);">Principal</span>`;

  const groupsHtml = agent.groups ? agent.groups.map(g => `
    <div class="skill-group">
      <div class="skill-group-label">${g.label}</div>
      <div class="skill-chips">${g.skills.map(s => `<span class="skill-chip">${s}</span>`).join('')}</div>
    </div>
  `).join('') : '';

  return `
    <div class="agent-card" onclick="toggleCard(this)">
      <div class="agent-card-top">
        <div class="agent-head">
          <span class="agent-badge">${agent.id}</span>
          <span class="agent-pulse"></span>
        </div>
        <div class="agent-name">${agent.name}</div>
        <div class="agent-desc">${agent.desc}</div>
      </div>
      <div class="agent-foot">
        <span class="agent-reports">${reportsHtml}</span>
        <span class="agent-expand">
          <span>${skillCount} skills</span>
          <svg class="expand-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
        </span>
      </div>
      <div class="agent-skills">${groupsHtml}</div>
    </div>
  `;
}

function toggleCard(card) {
  card.classList.toggle('open');
}
</script>

</body>
</html>
